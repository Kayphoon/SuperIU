name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "master"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: build server (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: superiu-server-linux-x64
          - target: bun-linux-arm64
            asset: superiu-server-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Compile server binary
        run: node scripts/build-server-binary.mjs --target=${{ matrix.target }}

      - name: Rename and checksum
        run: |
          mkdir -p release
          cp "dist/server/${{ matrix.asset }}" "release/${{ matrix.asset }}"
          chmod +x "release/${{ matrix.asset }}"
          sha256sum "release/${{ matrix.asset }}" > "release/${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}*
          if-no-files-found: error

  build-desktop-mac:
    name: build desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Package macOS app zip
        run: pnpm --filter @agent/desktop run package:zip --no-install

      - name: Checksum
        working-directory: packages/desktop/dist
        run: |
          for f in *.zip; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: superiu-desktop-mac
          path: |
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-server, build-desktop-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -l release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SuperIU Latest (master)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
